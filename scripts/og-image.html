<!doctype html>
<!--
  Source of public/og-image.png, the 1200x630 link preview (Open Graph) image. Colours and font
  match src/app.css. To regenerate: open this file in a browser at 1200x630 and screenshot it,
  e.g. with Playwright: page.setViewportSize({ width: 1200, height: 630 }), page.screenshot().
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Oswald Variable';
        font-weight: 200 700;
        src: url('../node_modules/@fontsource-variable/oswald/files/oswald-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background: #12161b;
        color: #e8ecef;
        font-family: 'Oswald Variable', 'Arial Narrow', sans-serif;
        position: relative;
        overflow: hidden;
      }
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgb(0 0 0 / 0.14) 0 1px,
          transparent 1px 4px
        );
        pointer-events: none;
      }
      .frame {
        position: absolute;
        inset: 36px;
        border: 2px solid #34404c;
        border-radius: 6px;
        background: linear-gradient(135deg, #1a1f26, #12161b 70%);
        padding: 64px 72px;
        display: flex;
        gap: 64px;
      }
      .left {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .icon {
        width: 112px;
        height: 112px;
      }
      h1 {
        font-size: 132px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .sub {
        margin-top: 22px;
        font-size: 27px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #62d394;
      }
      .tag {
        margin-top: 36px;
        font-size: 40px;
        font-weight: 400;
        line-height: 1.25;
      }
      .foot {
        margin-top: auto;
        font-size: 24px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #9aa7b3;
      }
      .cards {
        width: 330px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        justify-content: center;
      }
      .card {
        background: #20262e;
        border: 1px solid #34404c;
        border-radius: 4px;
        padding: 20px 24px;
      }
      .card h2 {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .bar {
        display: flex;
        gap: 5px;
        height: 14px;
        margin-top: 8px;
      }
      .bar i {
        flex: 1;
        background: #2b343e;
        border: 1px solid #6b7a88;
        border-radius: 1px;
      }
      .bar.stock i.on {
        background: #3a9e66;
        border-color: #3a9e66;
      }
      .bar.sup i.on {
        background: #3f6db8;
        border-color: #3f6db8;
      }
      .bar.warn i.on {
        background: #f0b450;
        border-color: #f0b450;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="left">
        <div class="brand">
          <svg class="icon" viewBox="0 0 32 32">
            <rect width="32" height="32" rx="4" fill="#0b0f0c" />
            <path
              d="M7 10l6 6-6 6"
              fill="none"
              stroke="#7dff9b"
              stroke-width="3"
              stroke-linecap="square"
            />
            <path d="M16 23h9" stroke="#7dff9b" stroke-width="3" />
          </svg>
          <h1>LSOS</h1>
        </div>
        <p class="sub">Los Santos Operating System</p>
        <p class="tag">Track your GTA Online businesses,<br />safes and cooldowns.</p>
        <p class="foot">Free · No account · Runs in your browser</p>
      </div>
      <div class="cards">
        <div class="card">
          <h2>Businesses</h2>
          <div class="bar stock">
            <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i
            ><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i>
          </div>
          <div class="bar sup">
            <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i
            ><i></i><i></i>
          </div>
        </div>
        <div class="card">
          <h2>Safes</h2>
          <div class="bar stock">
            <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i
            ><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i
            ><i class="on"></i><i></i>
          </div>
        </div>
        <div class="card">
          <h2>Cooldowns</h2>
          <div class="bar warn">
            <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i
            ><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
